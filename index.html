<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEHA HOMOEOPATHIC CLINIC</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f6;
  color: #222;
}

header {
  background: #176b4d;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 5px 0 0;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 18px;
  margin-bottom: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

h2 {
  color: #176b4d;
}

input,
textarea,
select,
button {
  width: 100%;
  padding: 11px;
  margin-top: 7px;
  margin-bottom: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  background: #176b4d;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: .9;
}

.secondary {
  background: #555;
}

.edit {
  background: #176b4d;
}

.hidden {
  display: none !important;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
}

.patient-result {
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-top: 8px;
  cursor: pointer;
  background: #fafafa;
}

.patient-result:hover {
  background: #eef7f2;
}

.visit {
  border-left: 4px solid #176b4d;
  padding: 12px;
  margin-bottom: 12px;
  background: #f8faf9;
  border-radius: 6px;
}

.message {
  padding: 10px;
  border-radius: 7px;
  margin-bottom: 12px;
  background: #eef7f2;
}

.error {
  background: #ffe9e7;
  color: #9b1c1c;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.topbar button {
  width: auto;
}

.edit-box {
  background: #f1f7f4;
  padding: 15px;
  border-radius: 8px;
  margin-top: 10px;
}

@media(max-width:700px) {
  .grid {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 20px;
  }

  .topbar {
    flex-direction: column;
    align-items: stretch;
  }

  .topbar button {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
<h1>NEHA HOMOEOPATHIC CLINIC</h1>
<p>Patient Management System</p>
</header>

<div class="container">

<!-- ================= LOGIN ================= -->

<div id="loginSection" class="card">

<h2>Clinic Login</h2>

<input
  id="loginEmail"
  type="email"
  placeholder="Email address"
>

<input
  id="loginPassword"
  type="password"
  placeholder="Password"
>

<button id="loginButton" type="button">
Login
</button>

<div id="loginMessage"></div>

</div>


<!-- ================= APPLICATION ================= -->

<div id="appSection" class="hidden">

<div class="card">

<div class="topbar">

<strong>Clinic Dashboard</strong>

<button
  id="logoutButton"
  class="secondary"
  type="button"
>
Logout
</button>

</div>

</div>


<!-- ================= ADD PATIENT ================= -->

<div class="card">

<h2>Add New Patient</h2>

<div class="grid">

<div>
<label>Name *</label>

<input
  id="patientName"
  type="text"
  placeholder="Patient name"
>
</div>

<div>
<label>Age</label>

<input
  id="patientAge"
  type="number"
  placeholder="Age"
>
</div>

<div>
<label>Gender</label>

<select id="patientGender">

<option value="">Select</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
<option value="Other">Other</option>

</select>

</div>

<div>
<label>Mobile</label>

<input
  id="patientMobile"
  type="tel"
  placeholder="Mobile number"
>

</div>

</div>

<label>Address</label>

<textarea
  id="patientAddress"
  placeholder="Address"
></textarea>

<button id="savePatientButton" type="button">
Save Patient
</button>

<div id="patientMessage"></div>

</div>


<!-- ================= SEARCH ================= -->

<div class="card">

<h2>Search Patient</h2>

<input
  id="searchBox"
  type="text"
  placeholder="Search by name or mobile"
>

<div id="searchResults"></div>

</div>


<!-- ================= PATIENT PROFILE ================= -->

<div
  id="patientSection"
  class="card hidden"
>

<h2>Patient Profile</h2>

<div id="patientDetails"></div>

<button
  id="editPatientButton"
  class="edit"
  type="button"
>
✏️ Edit Patient
</button>


<!-- PATIENT EDIT -->

<div
  id="patientEditBox"
  class="edit-box hidden"
>

<h3>Edit Patient</h3>

<label>Name</label>

<input id="editName">

<label>Age</label>

<input
  id="editAge"
  type="number"
>

<label>Gender</label>

<select id="editGender">

<option value="">Select</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
<option value="Other">Other</option>

</select>

<label>Mobile</label>

<input id="editMobile">

<label>Address</label>

<textarea id="editAddress"></textarea>

<button
  id="savePatientEditButton"
  type="button"
>
Save Changes
</button>

<button
  id="cancelPatientEditButton"
  class="secondary"
  type="button"
>
Cancel
</button>

<div id="editPatientMessage"></div>

</div>


<hr>

<h2>Visit History</h2>

<div id="visitHistory"></div>


<hr>

<h2>Add New Visit</h2>

<label>Visit Date</label>

<input
  id="visitDate"
  type="date"
>

<label>Chief Complaints</label>

<textarea id="complaints"></textarea>

<label>Diagnosis</label>

<textarea id="diagnosis"></textarea>

<label>Prescription / Medicines</label>

<textarea id="prescription"></textarea>

<label>Advice</label>

<textarea id="advice"></textarea>

<label>Follow-up Date</label>

<input
  id="followUp"
  type="date"
>

<label>Notes</label>

<textarea id="notes"></textarea>

<button
  id="saveVisitButton"
  type="button"
>
Save Visit
</button>

<div id="visitMessage"></div>

</div>

</div>

<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://snoyzbsnbhjxzemuoewe.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_HzdRFn56iEpMrCjEUGPong_nFXvo4IU";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let currentPatient = null;


/* =====================================================
   ELEMENTS
===================================================== */

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const savePatientButton =
document.getElementById("savePatientButton");

const saveVisitButton =
document.getElementById("saveVisitButton");

const editPatientButton =
document.getElementById("editPatientButton");

const savePatientEditButton =
document.getElementById("savePatientEditButton");

const cancelPatientEditButton =
document.getElementById("cancelPatientEditButton");


/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener("click", async function() {

  const email =
    document.getElementById("loginEmail")
    .value
    .trim();

  const password =
    document.getElementById("loginPassword")
    .value;

  const message =
    document.getElementById("loginMessage");

  message.innerHTML = "";

  if (!email || !password) {

    message.innerHTML =
      '<div class="message error">Enter email and password.</div>';

    return;
  }

  loginButton.disabled = true;
  loginButton.innerText = "Logging in...";

  try {

    const result =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (result.error) {

      message.innerHTML =
        '<div class="message error">' +
        escapeHtml(result.error.message) +
        '</div>';

      return;
    }

    showApp();

  } catch(error) {

    message.innerHTML =
      '<div class="message error">' +
      escapeHtml(error.message) +
      '</div>';

  } finally {

    loginButton.disabled = false;
    loginButton.innerText = "Login";
  }

});


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener("click", async function() {

  await supabaseClient.auth.signOut();

  currentPatient = null;

  document
    .getElementById("appSection")
    .classList.add("hidden");

  document
    .getElementById("loginSection")
    .classList.remove("hidden");

});


/* =====================================================
   SHOW APP
===================================================== */

function showApp() {

  document
    .getElementById("loginSection")
    .classList.add("hidden");

  document
    .getElementById("appSection")
    .classList.remove("hidden");

  document
    .getElementById("visitDate")
    .value =
    new Date()
    .toISOString()
    .split("T")[0];
}


/* =====================================================
   CHECK EXISTING LOGIN
===================================================== */

async function checkLogin() {

  const result =
    await supabaseClient.auth.getSession();

  if (
    result.data &&
    result.data.session
  ) {

    showApp();
  }
}


/* =====================================================
   SAVE PATIENT
===================================================== */

savePatientButton.addEventListener(
"click",
async function() {

  const name =
    document
    .getElementById("patientName")
    .value
    .trim();

  const age =
    document
    .getElementById("patientAge")
    .value;

  const gender =
    document
    .getElementById("patientGender")
    .value;

  const mobile =
    document
    .getElementById("patientMobile")
    .value
    .trim();

  const address =
    document
    .getElementById("patientAddress")
    .value
    .trim();

  const message =
    document.getElementById("patientMessage");

  message.innerHTML = "";

  if (!name) {

    message.innerHTML =
      '<div class="message error">Patient name is required.</div>';

    return;
  }

  const result =
    await supabaseClient
    .from("patients")
    .insert([{
      name: name,
      age: age ? parseInt(age) : null,
      gender: gender || null,
      mobile: mobile || null,
      address: address || null
    }])
    .select()
    .single();

  if (result.error) {

    message.innerHTML =
      '<div class="message error">' +
      escapeHtml(result.error.message) +
      '</div>';

    return;
  }

  message.innerHTML =
    '<div class="message">' +
    'Patient saved successfully. ID: ' +
    result.data.id +
    '</div>';

  document.getElementById("patientName").value = "";
  document.getElementById("patientAge").value = "";
  document.getElementById("patientGender").value = "";
  document.getElementById("patientMobile").value = "";
  document.getElementById("patientAddress").value = "";

  openPatient(result.data.id);

});


/* =====================================================
   SEARCH
===================================================== */

let searchTimer;

document
.getElementById("searchBox")
.addEventListener("input", function() {

  clearTimeout(searchTimer);

  searchTimer =
    setTimeout(searchPatients, 300);

});


async function searchPatients() {

  const search =
    document
    .getElementById("searchBox")
    .value
    .trim();

  const results =
    document.getElementById("searchResults");

  results.innerHTML = "";

  if (!search) {
    return;
  }

  const result =
    await supabaseClient
    .from("patients")
    .select("*")
    .or(
      "name.ilike.%" +
      search +
      "%,mobile.ilike.%" +
      search +
      "%"
    )
    .order("name");

  if (result.error) {

    results.innerHTML =
      '<div class="message error">' +
      escapeHtml(result.error.message) +
      '</div>';

    return;
  }

  if (
    !result.data ||
    result.data.length === 0
  ) {

    results.innerHTML =
      '<div class="message">No patient found.</div>';

    return;
  }

  result.data.forEach(function(patient) {

    const div =
      document.createElement("div");

    div.className =
      "patient-result";

    div.innerHTML =
      "<strong>" +
      escapeHtml(patient.name) +
      "</strong><br>" +

      "Patient ID: " +
      patient.id +
      "<br>" +

      (patient.age
        ? "Age: " + patient.age + "<br>"
        : "") +

      (patient.gender
        ? "Gender: " +
          escapeHtml(patient.gender) +
          "<br>"
        : "") +

      (patient.mobile
        ? "Mobile: " +
          escapeHtml(patient.mobile)
        : "");

    div.addEventListener(
      "click",
      function() {
        openPatient(patient.id);
      }
    );

    results.appendChild(div);

  });

}


/* =====================================================
   OPEN PATIENT
===================================================== */

async function openPatient(patientId) {

  const result =
    await supabaseClient
    .from("patients")
    .select("*")
    .eq("id", patientId)
    .single();

  if (result.error) {

    alert(result.error.message);
    return;
  }

  currentPatient =
    result.data;

  document
    .getElementById("patientSection")
    .classList.remove("hidden");

  displayPatient();

  await loadVisits(patientId);

  document
    .getElementById("patientSection")
    .scrollIntoView({
      behavior: "smooth"
    });
}


/* =====================================================
   DISPLAY PATIENT
===================================================== */

function displayPatient() {

  const p =
    currentPatient;

  document
    .getElementById("patientDetails")
    .innerHTML =

    "<p><strong>Patient ID:</strong> " +
    p.id +
    "</p>" +

    "<p><strong>Name:</strong> " +
    escapeHtml(p.name) +
    "</p>" +

    "<p><strong>Age:</strong> " +
    (p.age ?? "") +
    "</p>" +

    "<p><strong>Gender:</strong> " +
    escapeHtml(p.gender ?? "") +
    "</p>" +

    "<p><strong>Mobile:</strong> " +
    escapeHtml(p.mobile ?? "") +
    "</p>" +

    "<p><strong>Address:</strong> " +
    escapeHtml(p.address ?? "") +
    "</p>";

}


/* =====================================================
   EDIT PATIENT
===================================================== */

editPatientButton.addEventListener(
"click",
function() {

  if (!currentPatient) {
    return;
  }

  document.getElementById("editName").value =
    currentPatient.name || "";

  document.getElementById("editAge").value =
    currentPatient.age ?? "";

  document.getElementById("editGender").value =
    currentPatient.gender || "";

  document.getElementById("editMobile").value =
    currentPatient.mobile || "";

  document.getElementById("editAddress").value =
    currentPatient.address || "";

  document
    .getElementById("patientEditBox")
    .classList.remove("hidden");

});


/* =====================================================
   CANCEL EDIT
===================================================== */

cancelPatientEditButton.addEventListener(
"click",
function() {

  document
    .getElementById("patientEditBox")
    .classList.add("hidden");

});


/* =====================================================
   SAVE PATIENT EDIT
===================================================== */

savePatientEditButton.addEventListener(
"click",
async function() {

  if (!currentPatient) {
    return;
  }

  const name =
    document.getElementById("editName")
    .value
    .trim();

  const age =
    document.getElementById("editAge")
    .value;

  const gender =
    document.getElementById("editGender")
    .value;

  const mobile =
    document.getElementById("editMobile")
    .value
    .trim();

  const address =
    document.getElementById("editAddress")
    .value
    .trim();

  const message =
    document.getElementById("editPatientMessage");

  if (!name) {

    message.innerHTML =
      '<div class="message error">Name is required.</div>';

    return;
  }

  const result =
    await supabaseClient
    .from("patients")
    .update({
      name: name,
      age: age ? parseInt(age) : null,
      gender: gender || null,
      mobile: mobile || null,
      address: address || null
    })
    .eq("id", currentPatient.id)
    .select()
    .single();

  if (result.error) {

    message.innerHTML =
      '<div class="message error">' +
      escapeHtml(result.error.message) +
      '</div>';

    return;
  }

  currentPatient =
    result.data;

  displayPatient();

  document
    .getElementById("patientEditBox")
    .classList.add("hidden");

  await searchPatients();

});


/* =====================================================
   LOAD VISITS
===================================================== */

async function loadVisits(patientId) {

  const history =
    document.getElementById("visitHistory");

  history.innerHTML =
    "Loading history...";

  const result =
    await supabaseClient
    .from("visits")
    .select("*")
    .eq("patient_id", patientId)
    .order("visit_date", {
      ascending: false
    });

  if (result.error) {

    history.innerHTML =
      '<div class="message error">' +
      escapeHtml(result.error.message) +
      '</div>';

    return;
  }

  if (
    !result.data ||
    result.data.length === 0
  ) {

    history.innerHTML =
      '<div class="message">No previous visits found.</div>';

    return;
  }

  history.innerHTML = "";

  result.data.forEach(function(visit) {

    const div =
      document.createElement("div");

    div.className =
      "visit";

    div.innerHTML =

      "<strong>Visit Date:</strong> " +
      escapeHtml(visit.visit_date || "") +

      (visit.complaints
        ? "<p><strong>Complaints:</strong><br>" +
          formatText(visit.complaints) +
          "</p>"
        : "") +

      (visit.diagnosis
        ? "<p><strong>Diagnosis:</strong><br>" +
          formatText(visit.diagnosis) +
          "</p>"
        : "") +

      (visit.prescription
        ? "<p><strong>Prescription:</strong><br>" +
          formatText(visit.prescription) +
          "</p>"
        : "") +

      (visit.advice
        ? "<p><strong>Advice:</strong><br>" +
          formatText(visit.advice) +
          "</p>"
        : "") +

      (visit.follow_up
        ? "<p><strong>Follow-up:</strong> " +
          escapeHtml(visit.follow_up) +
          "</p>"
        : "") +

      (visit.notes
        ? "<p><strong>Notes:</strong><br>" +
          formatText(visit.notes) +
          "</p>"
        : "");

    history.appendChild(div);

  });

}


/* =====================================================
   SAVE VISIT
===================================================== */

saveVisitButton.addEventListener(
"click",
async function() {

  if (!currentPatient) {

    alert("Please select a patient first.");
    return;
  }

  const visitDate =
    document.getElementById("visitDate").value;

  const complaints =
    document.getElementById("complaints")
    .value
    .trim();

  const diagnosis =
    document.getElementById("diagnosis")
    .value
    .trim();

  const prescription =
    document.getElementById("prescription")
    .value
    .trim();

  const advice =
    document.getElementById("advice")
    .value
    .trim();

  const followUp =
    document.getElementById("followUp").value;

  const notes =
    document.getElementById("notes")
    .value
    .trim();

  const message =
    document.getElementById("visitMessage");

  if (!visitDate) {

    message.innerHTML =
      '<div class="message error">Visit date is required.</div>';

    return;
  }

  const result =
    await supabaseClient
    .from("visits")
    .insert([{
      patient_id: currentPatient.id,
      visit_date: visitDate,
      complaints: complaints || null,
      diagnosis: diagnosis || null,
      prescription: prescription || null,
      advice: advice || null,
      follow_up: followUp || null,
      notes: notes || null
    }]);

  if (result.error) {

    message.innerHTML =
      '<div class="message error">' +
      escapeHtml(result.error.message) +
      '</div>';

    return;
  }

  message.innerHTML =
    '<div class="message">Visit saved successfully.</div>';

  document.getElementById("complaints").value = "";
  document.getElementById("diagnosis").value = "";
  document.getElementById("prescription").value = "";
  document.getElementById("advice").value = "";
  document.getElementById("followUp").value = "";
  document.getElementById("notes").value = "";

  await loadVisits(currentPatient.id);

});


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatText(value) {

  return escapeHtml(value)
    .replace(/\n/g,"<br>");
}


/* =====================================================
   START
===================================================== */

checkLogin();

</script>

</body>
</html>
